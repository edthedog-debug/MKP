name: Run Genetic AI Solver

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Genetic Algorithm Solver
        run: node solver.js

      - name: Commit and push memory updates
        run: |
          git config --global user.name 'AI Genetic Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add memory.txt
          git commit -m "AI evolution update: memory and population refined [skip ci]" || exit 0
          git push
