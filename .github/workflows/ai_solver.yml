name: Run AI Math Solver

on:
  schedule:
    # Se ejecuta todos los días a las 00:00 y a las 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions de GitHub

jobs:
  solve:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para hacer commit automático de la memoria

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Solver Agent
        run: node solver.js

      - name: Commit and push memory updates
        run: |
          git config --global user.name 'AI Solver Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add memory.txt
          git commit -m "AI update: memory refined [skip ci]" || exit 0
          git push
