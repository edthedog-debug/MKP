<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional AI Optimization Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
        .container { max-width: 700px; margin: auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 5px; }
        p { color: #94a3b8; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid #334155; }
        .metric { font-size: 32px; font-weight: bold; color: #4ade80; margin-top: 10px; }
        .subtext { font-size: 14px; color: #64748b; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Autonomous Genetic AI Solver</h1>
        <p>Solving complex multi-variable optimization problems using native evolutionary metaheuristics.</p>
        
        <div class="grid">
            <div class="card">
                <h3>Best Optimal Score</h3>
                <div class="metric" id="score">Loading...</div>
                <div class="subtext">Maximized asset value</div>
            </div>
            <div class="card">
                <h3>Generations Evolved</h3>
                <div class="metric" id="generation" style="color: #38bdf8;">Loading...</div>
                <div class="subtext">Cumulative evolutionary cycles</div>
            </div>
        </div>
    </div>

    <script>
        fetch('memory.txt')
            .then(response => response.json())
            .then(data => {
                document.getElementById('score').innerText = data.bestScore;
                document.getElementById('generation').innerText = data.generation;
            })
            .catch(() => {
                document.getElementById('score').innerText = 'Initializing...';
                document.getElementById('generation').innerText = '0';
            });
    </script>
</body>
</html>
