<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Math Solver Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
        .container { max-width: 600px; margin: auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 10px; }
        p { color: #94a3b8; }
        .card { background: #0f172a; padding: 20px; border-radius: 8px; margin-top: 20px; border: 1px solid #334155; }
        .metric { font-size: 28px; font-weight: bold; color: #4ade80; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Mathematical Solver Agent</h1>
        <p>Autonomous agent solving the Multidimensional Knapsack Problem via GitHub Actions.</p>
        
        <div class="card">
            <h3>Best Score Achieved</h3>
            <div class="metric" id="score">Loading...</div>
        </div>

        <div class="card">
            <h3>Total Automated Iterations</h3>
            <div id="iterations" style="font-size: 20px; font-weight: bold;">Loading...</div>
        </div>
    </div>

    <script>
        // Carga el archivo memory.txt automáticamente para mostrar los datos en tiempo real en GitHub Pages
        fetch('memory.txt')
            .then(response => response.json())
            .then(data => {
                document.getElementById('score').innerText = data.bestScore;
                document.getElementById('iterations').innerText = data.iterations;
            })
            .catch(error => {
                document.getElementById('score').innerText = 'No data yet / Run action first';
                document.getElementById('iterations').innerText = '0';
            });
    </script>
</body>
</html>
